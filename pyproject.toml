[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pelens"
version = "0.20.0"
description = "Static PE file analyzer for malware triage: structure, strings, crypto detection and suspicion score"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "FzRsLLaSheR"}]
dependencies = [
    "pefile>=2023.2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "capstone>=5.0",
    "dnfile>=0.15",
    "yara-python>=4.3",
    "asn1crypto>=1.5",
    "mscerts>=2024.1",
    "ppdeep>=20200505",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]

[project.scripts]
pelens = "pelens.cli:main"

[project.gui-scripts]
pelens-gui = "pelens.gui:main"

[tool.setuptools.packages.find]
include = ["pelens*"]

[tool.setuptools.package-data]
pelens = ["rules/*.yaml", "gui/fonts/*"]
