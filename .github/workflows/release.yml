# On a "v*" tag (e.g. v0.19.0) builds the Windows executables and publishes them in a GitHub release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pelens.exe and pelens-gui.exe
        shell: cmd
        run: build_exe.bat
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pelens.exe
            dist/pelens-gui.exe
          generate_release_notes: true
