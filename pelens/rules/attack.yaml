# Mapping of the PELens rules to MITRE ATT&CK (Enterprise) techniques.
# Names follow the current ATT&CK version; the official reference is https://attack.mitre.org/techniques/<ID>
techniques:
  T1016: "System Network Configuration Discovery"
  T1027: "Obfuscated Files or Information"
  T1027.001: "Obfuscated Files or Information: Binary Padding"
  T1027.002: "Obfuscated Files or Information: Software Packing"
  T1027.003: "Obfuscated Files or Information: Steganography"
  T1027.007: "Obfuscated Files or Information: Dynamic API Resolution"
  T1027.009: "Obfuscated Files or Information: Embedded Payloads"
  T1027.013: "Obfuscated Files or Information: Encrypted/Encoded File"
  T1036.001: "Masquerading: Invalid Code Signature"
  T1041: "Exfiltration Over C2 Channel"
  T1055: "Process Injection"
  T1056.001: "Input Capture: Keylogging"
  T1057: "Process Discovery"
  T1059: "Command and Scripting Interpreter"
  T1070.004: "Indicator Removal: File Deletion"
  T1071.001: "Application Layer Protocol: Web Protocols"
  T1102.001: "Web Service: Dead Drop Resolver"
  T1105: "Ingress Tool Transfer"
  T1106: "Native API"
  T1113: "Screen Capture"
  T1140: "Deobfuscate/Decode Files or Information"
  T1486: "Data Encrypted for Impact"
  T1497.001: "Virtualization/Sandbox Evasion: System Checks"
  T1497.003: "Virtualization/Sandbox Evasion: Time Based Checks"
  T1543.003: "Create or Modify System Process: Windows Service"
  T1547.001: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder"
  T1539: "Steal Web Session Cookie"
  T1553.002: "Subvert Trust Controls: Code Signing"
  T1555: "Credentials from Password Stores"
  T1555.003: "Credentials from Password Stores: Credentials from Web Browsers"
  T1564.003: "Hide Artifacts: Hidden Window"
  T1562.001: "Impair Defenses: Disable or Modify Tools"
  T1562.006: "Impair Defenses: Indicator Blocking"
  T1574.001: "Hijack Execution Flow: DLL"
  T1620: "Reflective Code Loading"
  T1622: "Debugger Evasion"

