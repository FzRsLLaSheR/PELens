# Signatures of cryptographic algorithms, compression and hashes recognized by PELens.
#
# Signature types:
#   bytes   hex byte sequence, searched as is
#   string  ASCII text
#   dwords  32-bit values; contiguous: true  = one after another in a table (little or big endian)
#                          contiguous: false = all present within "window" bytes (e.g. immediates in code)
#   qwords  64-bit values, contiguous or within "window" bytes like dwords
# confidence: high | medium | low  (scoring rules usually only use medium and high)
# category:   stream_cipher | block_cipher | asymmetric | hash | checksum | encoding | compression
#
# Long tables are generated by code (tests/gen_signatures.py), not copied by hand.

algorithms:
  - name: AES
    category: block_cipher
    signatures:
      - {name: "S-box", type: bytes, confidence: high, hex: "637c777bf26b6fc53001672bfed7ab76ca82c97dfa5947f0add4a2af9ca472c0b7fd9326363ff7cc34a5e5f171d8311504c723c31896059a071280e2eb27b275"}
      - {name: "inverse S-box", type: bytes, confidence: high, hex: "52096ad53036a538bf40a39e81f3d7fb7ce339829b2fff87348e4344c4dee9cb547b9432a6c2233dee4c950b42fac34e082ea16628d924b2765ba2496d8bd125"}
      - {name: "Te0 table", type: dwords, contiguous: true, confidence: high, values: [0xc66363a5, 0xf87c7c84, 0xee777799, 0xf67b7b8d, 0xfff2f20d, 0xd66b6bbd]}
      - {name: "Td0 table", type: dwords, contiguous: true, confidence: high, values: [0x51f4a750, 0x7e416553, 0x1a17a4c3, 0x3a275e96, 0x3bab6bcb, 0x1f9d45f1]}
      # Rcon constants are powers of 2, like many ordinary bitmask tables: low confidence
      - {name: "Rcon", type: dwords, contiguous: true, confidence: low, values: [0x01000000, 0x02000000, 0x04000000, 0x08000000, 0x10000000, 0x20000000, 0x40000000, 0x80000000]}

  - name: ChaCha20/Salsa20
    category: stream_cipher
    signatures:
      - {name: "sigma constant", type: string, confidence: high, text: "expand 32-byte k"}
      - {name: "tau constant", type: string, confidence: high, text: "expand 16-byte k"}
      - {name: "sigma as code immediates", type: dwords, contiguous: false, window: 128, confidence: high, values: [0x61707865, 0x3320646e, 0x79622d32, 0x6b206574]}

  - name: DES
    category: block_cipher
    signatures:
      - {name: "S-box 1", type: bytes, confidence: high, hex: "0e040d01020f0b08030a060c05090007000f07040e020d010a060c0b0905030804"}
      - {name: "PC-1 table", type: bytes, confidence: medium, hex: "39312921191109013a322a221a120a02"}
      - {name: "PC-1 table (0-based)", type: bytes, confidence: medium, hex: "38302820181008003931292119110901"}
      - {name: "initial permutation", type: bytes, confidence: medium, hex: "3a322a221a120a023c342c241c140c04"}

  - name: Blowfish
    category: block_cipher
    signatures:
      - {name: "P-array (digits of pi)", type: dwords, contiguous: true, confidence: high, values: [0x243f6a88, 0x85a308d3, 0x13198a2e, 0x03707344, 0xa4093822, 0x299f31d0]}

  - name: TEA/XTEA
    category: block_cipher
    signatures:
      # the same constant is used by hash functions (Fibonacci hashing): low confidence
      - {name: "delta 0x9E3779B9", type: dwords, contiguous: true, confidence: low, values: [0x9e3779b9]}
      - {name: "negated delta 0x61C88647", type: dwords, contiguous: true, confidence: low, values: [0x61c88647]}
      - {name: "TEA final sum (delta*32)", type: dwords, contiguous: true, confidence: medium, values: [0xc6ef3720]}

  - name: RSA
    category: asymmetric
    signatures:
      - {name: "PUBLICKEYBLOB (CryptoAPI)", type: bytes, confidence: high, hex: "0602000000a4000052534131"}
      - {name: "PRIVATEKEYBLOB (CryptoAPI)", type: bytes, confidence: high, hex: "0702000000a4000052534132"}
      - {name: "PEM public key", type: string, confidence: high, text: "-----BEGIN PUBLIC KEY-----"}
      - {name: "PEM RSA public key", type: string, confidence: high, text: "-----BEGIN RSA PUBLIC KEY-----"}
      - {name: "PEM RSA private key", type: string, confidence: high, text: "-----BEGIN RSA PRIVATE KEY-----"}
      - {name: "PEM private key", type: string, confidence: high, text: "-----BEGIN PRIVATE KEY-----"}
      - {name: "OID rsaEncryption (DER)", type: bytes, confidence: medium, hex: "06092a864886f70d010101"}

  - name: MD5
    category: hash
    signatures:
      - {name: "T constants", type: dwords, contiguous: false, window: 512, confidence: high, values: [0xd76aa478, 0xe8c7b756, 0x242070db, 0xc1bdceee]}

  - name: MD5/SHA-1
    category: hash
    signatures:
      - {name: "initial values", type: dwords, contiguous: false, window: 64, confidence: medium, values: [0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476]}

  - name: SHA-1
    category: hash
    signatures:
      - {name: "K constants", type: dwords, contiguous: false, window: 4096, confidence: high, values: [0x5a827999, 0x6ed9eba1, 0x8f1bbcdc, 0xca62c1d6]}

  - name: SHA-256
    category: hash
    signatures:
      - {name: "K constants", type: dwords, contiguous: true, confidence: high, values: [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5]}
      - {name: "initial values", type: dwords, contiguous: false, window: 64, confidence: medium, values: [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a]}

  - name: SHA-512
    category: hash
    signatures:
      - {name: "K constants", type: qwords, confidence: high, values: [0x428a2f98d728ae22, 0x7137449123ef65cd, 0xb5c0fbcfec4d3b2f, 0xe9b5dba58189dbbc]}

  - name: CRC32
    category: checksum
    signatures:
      - {name: "table", type: dwords, contiguous: true, confidence: high, values: [0x0, 0x77073096, 0xee0e612c, 0x990951ba, 0x76dc419, 0x706af48f]}

  - name: Base64
    category: encoding
    signatures:
      - {name: "standard alphabet", type: string, confidence: high, text: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"}

  # --- compression -------------------------------------------------------------------------------
  - name: aPLib
    category: compression
    signatures:
      - {name: "decompressor (aP_depack, NASM)", type: bytes, confidence: high, hex: "fcb28031dba4b302"}
      - {name: "decompressor (aP_depack, MASM)", type: bytes, confidence: high, hex: "fcb28033dba4b302"}
      - {name: "AP32 header of a compressed block", type: bytes, confidence: high, hex: "4150333218000000"}
      - {name: "library banner", type: string, confidence: high, text: "aPLib v1."}

  - name: zlib/Deflate
    category: compression
    signatures:
      - {name: "zlib inflate copyright", type: string, confidence: high, text: " inflate 1."}
      - {name: "zlib deflate copyright", type: string, confidence: high, text: " deflate 1."}
      - {name: "zlib error message", type: string, confidence: medium, text: "invalid distance too far back"}
      - {name: "inflate length base table (16 bit)", type: bytes, confidence: high, hex: "03000400050006000700080009000a000b000d000f001100130017001b001f00"}
      - {name: "inflate distance base table (16 bit)", type: bytes, confidence: high, hex: "01000200030004000500070009000d001100190021003100410061008100c100"}
      - {name: "inflate length base table (32 bit)", type: dwords, contiguous: true, confidence: high, values: [3, 4, 5, 6, 7, 8, 9, 10, 11, 13, 15, 17, 19, 23, 27, 31]}
      - {name: "inflate distance base table (32 bit)", type: dwords, contiguous: true, confidence: high, values: [1, 2, 3, 4, 5, 7, 9, 13, 17, 25, 33, 49, 65, 97, 129, 193]}

  - name: LZMA/7z/XZ
    category: compression
    signatures:
      - {name: "7z archive signature", type: bytes, confidence: medium, hex: "377abcaf271c"}
      - {name: "XZ stream signature", type: bytes, confidence: medium, hex: "fd377a585a00"}

  - name: LZ4
    category: compression
    signatures:
      - {name: "frame magic 0x184D2204", type: dwords, contiguous: true, confidence: medium, values: [0x184d2204]}

  - name: Zstandard
    category: compression
    signatures:
      - {name: "frame magic 0xFD2FB528", type: dwords, contiguous: true, confidence: medium, values: [0xfd2fb528]}

  # --- non-cryptographic hashes (hash tables, API hashing, checksums) -------------------------------
  - name: MurmurHash2
    category: hash
    signatures:
      - {name: "constant m (32 bit)", type: dwords, contiguous: true, confidence: medium, values: [0x5bd1e995]}
      - {name: "constant m (MurmurHash64A)", type: qwords, contiguous: true, confidence: high, values: [0xc6a4a7935bd1e995]}

  - name: MurmurHash3
    category: hash
    signatures:
      - {name: "x86_32 constants c1/c2", type: dwords, contiguous: false, window: 256, confidence: high, values: [0xcc9e2d51, 0x1b873593]}
      - {name: "32-bit finalizer (fmix32)", type: dwords, contiguous: false, window: 128, confidence: medium, values: [0x85ebca6b, 0xc2b2ae35]}
      - {name: "x64_128 constants c1/c2", type: qwords, contiguous: false, window: 256, confidence: high, values: [0x87c37b91114253d5, 0x4cf5ad432745937f]}
      - {name: "64-bit finalizer (fmix64)", type: qwords, contiguous: false, window: 128, confidence: medium, values: [0xff51afd7ed558ccd, 0xc4ceb9fe1a85ec53]}

  - name: xxHash
    category: hash
    signatures:
      - {name: "xxHash32 primes", type: dwords, contiguous: false, window: 512, confidence: high, values: [0x9e3779b1, 0x85ebca77, 0xc2b2ae3d]}
      - {name: "xxHash64 primes", type: qwords, contiguous: false, window: 512, confidence: high, values: [0x9e3779b185ebca87, 0xc2b2ae3d27d4eb4f]}

  - name: SipHash
    category: hash
    signatures:
      - {name: "initialization constants", type: qwords, contiguous: false, window: 256, confidence: high, values: [0x736f6d6570736575, 0x646f72616e646f6d, 0x6c7967656e657261, 0x7465646279746573]}

  - name: FNV-1a
    category: hash
    signatures:
      - {name: "32-bit offset basis and prime", type: dwords, contiguous: false, window: 128, confidence: low, values: [0x811c9dc5, 0x01000193]}
      - {name: "64-bit offset basis and prime", type: qwords, contiguous: false, window: 128, confidence: low, values: [0xcbf29ce484222325, 0x00000100000001b3]}
